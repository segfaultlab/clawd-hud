<svg xmlns="http://www.w3.org/2000/svg" width="843" height="56" viewBox="0 0 843 56"><style>.bg{fill:#f0efea}@media (prefers-color-scheme:dark){.bg{fill:#262624}}.cap{font:12px ui-monospace,"SF Mono",Menlo,monospace;fill:#898781}</style><rect class="bg" width="843" height="56" rx="12"/><svg x="16" y="8" width="60" height="40" viewBox="0 0 60 40" shape-rendering="crispEdges"><style>
